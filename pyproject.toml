[tool.ruff]
target-version = "py313"
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = [
    "E", "F", "W",
    "I",
    "B", "B9", "C4",
    "UP",
    "RUF",
    "SIM",
    "ARG",
    "ERA",
]
ignore = [
    "ANN",
    "RUF012",
    "E501"
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.mccabe]
max-complexity = 12
