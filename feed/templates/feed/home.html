{% extends 'feed/base.html' %}
{% load static %}
{% block title %}Home | Agency{% endblock %}

{% block content %}
    <div class="hero">
        <h1 class="hero-title">Agency is an RSS Reader for users who want to control what they consume</h1>
        <p class="hero-tagline"><em>You</em> are in charge. Take the initiative. Be intentional.<br /> Take. Back. <span style="color: red;">Agency.</span></p>
    </div>
    <div>
       <a href="{% url 'feed:reader' %}" class="hero-button">Get Started</a>
    </div>
    <div class="hero-preview">
        <img src="{% static 'images/reader.png' %}" alt="Agency Reader">
    </div>
{% endblock %}
