<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        (function() {
            const saved = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

            if (saved === 'dark' || (!saved && prefersDark)) {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Agency{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'feed/css/style.css' %}">    
</head>

<body>
    <!--- Topbar -->
    <aside class="topbar">
        <button id="theme-toggle" aria-label="Toggle dark mode">
            <span class="light-icon">☀️</span>
            <span class="dark-icon" style="display:none;">🌙</span>
        </button>
        
        <!--- Frontpage -->
        <a href="{% url 'feed:home' %}" class="topbar-link">Frontpage</a>
        <!--- Feed -->
        <a href="{% url 'feed:reader' %}" class="topbar-link">Feed</a>
        <!--- Digest -->
        <a href="{% url 'feed:reader' %}" class="topbar-link">Digest</a>
        <!--- Discover -->
        <a href="{% url 'feed:reader' %}" class="topbar-link">Discover</a>
        {% if user.is_authenticated %}
            <form method="post" action="{% url 'feed:logout' %}" style="display: inline;">
                {% csrf_token %}
                <button type="submit" style="background: none; border: none; color: inherit; cursor: pointer; font-size: inherit;">Logout ({{ user.username }})</button>
            </form>
        {% else %}
            <a href="{% url 'feed:login' %}" class="topbar-link">Login</a>
            <a href="{% url 'feed:register' %}" class="topbar-link">Register</a>
        {% endif %}
    </aside>


    <div class="layout">
        <div class="main-content">
            <main>
                {% block content %}
                {% endblock %}
            </main>

            <footer>
                <p>&copy; {{ 'now'|date:"Y" }}</p>
            </footer>
        </div>
    </div>

    <script>
        window.HOME_URL = "{% url 'feed:home' %}";
    </script>

    {% load static %}
    <script src="{% static 'feed/js/theme-toggle.js' %}"></script>
    <script src="{% static 'feed/js/shortcuts.js' %}"></script>
    <script src="{% static 'feed/js/categorizeModal.js' %}"></script>
</body>
</html>
