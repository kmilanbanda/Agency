{% extends 'feed/base.html' %}

{% block content %}
<h2>Register</h2>
<form method="post" style="padding-left: 2rem">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="save-btn">Create Account</button>
</form>
<p style="padding-left: 2rem">Already have an account? <a href="{% url 'feed:login' %}">Log in</a></p>
{% endblock %}
