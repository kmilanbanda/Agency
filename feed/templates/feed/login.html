{% extends 'feed/base.html' %}

{% block content %}
<h2>Log In</h2>
<form method="post" style="padding-left: 2rem">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Login</button>
</form>
<p style="padding-left: 2rem">Don't have an account? <a href="{% url 'feed:register' %}">Register Now!</a></p>
{% endblock %}
